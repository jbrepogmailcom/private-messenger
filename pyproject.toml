[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "private-messenger"
version = "0.2.2"
description = "Independent experimental SMP messenger with a pinned native ratchet backend"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
  "cryptography==50.0.2", "PyNaCl==1.6.2", "pyOpenSSL==26.4.0",
  "argon2-cffi==25.1.0", "PySocks==1.7.1", "pyasn1==0.6.4",
  "tqdm==4.70.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.170.5", "ruff==0.17.1",
       "bandit==1.9.4", "pip-audit==2.10.1", "build==1.6.1"]

[project.scripts]
private-messenger = "private_messenger.cli:main"
private-chat = "private_messenger.messaging.secure_terminal:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
private_messenger = ["_crypto_native.abi3.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["public: explicit opt-in tests against real public infrastructure",
           "local_reference: tests against an unmodified local reference server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101"]
