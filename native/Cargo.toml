[package]
name = "private-messenger-crypto"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "_crypto_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", rev = "b369755533ef5a3fae9b31b989114f22e074dfab", features = ["mlkem1024"] }
spqr = { git = "https://github.com/signalapp/SparsePostQuantumRatchet.git", tag = "v1.6.0" }
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py312"] }
futures = "0.3"
rand = "0.9.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
zeroize = "=1.9.1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "deny"
